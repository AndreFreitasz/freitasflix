name: Freitas+ build 📦

on:
  push:
    branches:
      - freitas
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: freitas-release
  cancel-in-progress: true

permissions:
  contents: write

env:
  TIZEN_STUDIO_VER: 4.5.1

jobs:
  web:
    name: Web (servidor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit

      - name: Build
        run: npm run build:production

      - name: Package
        run: tar -czf freitas-web.tar.gz -C dist .

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            dist
            freitas-web.tar.gz
          retention-days: 3

  tizen:
    name: App Samsung (Tizen)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - name: Checkout (only the icon)
        uses: actions/checkout@v4
        with:
          path: repo
          sparse-checkout: tizen

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web
          path: web

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tizen Studio CLI
        run: |
          sudo apt-get install -y expect
          curl -fsSL -o tizen-installer "https://download.tizen.org/sdk/Installer/tizen-studio_${TIZEN_STUDIO_VER}/web-cli_Tizen_Studio_${TIZEN_STUDIO_VER}_ubuntu-64.bin"
          chmod +x tizen-installer
          ./tizen-installer --accept-license "${GITHUB_WORKSPACE}/tizen-studio"
          rm tizen-installer
          echo "${GITHUB_WORKSPACE}/tizen-studio/tools/ide/bin" >> "$GITHUB_PATH"

      - name: Create signing profile
        # Placeholder author certificate: the installer on the PC (Apps2Samsung)
        # re-signs the app with your own Samsung certificate for your TV.
        run: |
          tizen certificate -a Freitas -p 1234 -c BR -s SP -ct SaoPaulo -o Freitas -n Freitas -e freitas@example.org -f freitascert
          CERT=$(find "${GITHUB_WORKSPACE}/tizen-studio-data" -name 'freitascert.p12' | head -n1)
          cp "$CERT" "${GITHUB_WORKSPACE}/freitascert.p12"
          tizen security-profiles add -n Freitas -a "${GITHUB_WORKSPACE}/freitascert.p12" -p 1234
          tizen cli-config "profiles.path=${GITHUB_WORKSPACE}/tizen-studio-data/profile/profiles.xml"
          P="${GITHUB_WORKSPACE}/tizen-studio-data/profile/profiles.xml"
          sed -i "s|${GITHUB_WORKSPACE}/freitascert.pwd|1234|g" "$P"
          sed -i "s|${GITHUB_WORKSPACE}/tizen-studio-data/tools/certificate-generator/certificates/distributor/tizen-distributor-signer.pwd|tizenpkcs12passfordsigner|g" "$P"
          sed -i 's|password=""|password="tizenpkcs12passfordsigner"|g' "$P"
          grep -o 'password="[^"]*"' "$P" | sed 's/^/::notice::profile /'

      - name: Clone jellyfin-tizen
        uses: actions/checkout@v4
        with:
          repository: jellyfin/jellyfin-tizen
          path: jellyfin-tizen

      - name: Brand as Freitas+
        working-directory: jellyfin-tizen
        run: |
          # own package id so it installs next to (not over) the official Jellyfin app
          sed -i 's/AprZAARz4r/FrtsPlusTv/g' config.xml
          sed -i 's|id="http://jellyfin.org/Jellyfin"|id="http://jellyfin.org/FreitasPlus"|' config.xml
          sed -i 's|<name>Jellyfin</name>|<name>Freitas+</name>|' config.xml
          sed -i "s|appName: 'Jellyfin for Tizen'|appName: 'Freitas+ Samsung'|" tizen.js
          cp ../repo/tizen/icon.png icon.png
          rm -rf ../repo  # its babel/npm config must not leak into this build
          cat config.xml

      - name: Bundle the Freitas+ web build
        working-directory: jellyfin-tizen
        run: |
          ls ../web | sed 's/^/::notice::web: /'
          if ! JELLYFIN_WEB_DIR="$(cd ../web/dist && pwd)" npm ci --no-audit > ../bundle.log 2>&1; then
            tail -40 ../bundle.log | sed 's/^/::error::/'
            exit 1
          fi

      - name: Build widget
        working-directory: jellyfin-tizen
        run: |
          if ! tizen build-web -e ".*" -e gulpfile.babel.js -e gulpfile.js -e README.md -e "node_modules/*" -e "package*.json" -e "yarn.lock" > ../buildweb.log 2>&1; then
            tail -40 ../buildweb.log | sed 's/^/::error::/'
            exit 1
          fi

      - name: Package WGT
        working-directory: jellyfin-tizen
        run: |
          cat > package.exp <<'EOF'
          set timeout 900
          spawn tizen package -t wgt -o ./release -s Freitas -- .buildResult
          expect {
            "Author password:" { send -- "1234\r"; exp_continue }
            "Distributor password:" { send -- "tizenpkcs12passfordsigner\r"; exp_continue }
            "(N) ?" { send -- "N\r"; exp_continue }
            eof
          }
          EOF
          expect -f package.exp > ../package.log 2>&1 || true
          if ! ls release/*.wgt > /dev/null 2>&1; then
            tail -40 ../package.log | sed 's/^/::error::/'
            tail -40 "${GITHUB_WORKSPACE}/tizen-studio-data/cli/logs/cli.log" | sed 's/^/::error::/' || true
            exit 1
          fi
          mv release/*.wgt ../Freitas-Samsung.wgt

      - name: Print logs
        if: always()
        run: cat "${GITHUB_WORKSPACE}/tizen-studio-data/cli/logs/cli.log" || true

      - name: Upload wgt
        uses: actions/upload-artifact@v4
        with:
          name: tizen
          path: Freitas-Samsung.wgt
          retention-days: 3

  firetv:
    name: App Fire TV (Android)
    runs-on: ubuntu-latest
    env:
      JELLYFIN_ANDROID_VER: v2.7.3
    steps:
      - name: Checkout Freitas+
        uses: actions/checkout@v4
        with:
          path: repo
          sparse-checkout: android

      - name: Checkout jellyfin-android
        run: git clone -q --depth 1 --branch "$JELLYFIN_ANDROID_VER" https://github.com/jellyfin/jellyfin-android app

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Same signing key on every build so updates install over the old app.
      # Preferably a repository secret; otherwise one kept in the Actions cache.
      - name: Signing key (cache)
        uses: actions/cache@v4
        with:
          path: keystore
          key: freitas-firetv-keystore-v1

      - name: Signing key
        env:
          KS_B64: ${{ secrets.FIRETV_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.FIRETV_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p keystore
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > keystore/freitas.jks
            printf '%s' "$KS_PASS" > keystore/pass
          elif [ ! -f keystore/freitas.jks ]; then
            echo "::warning::No FIRETV_KEYSTORE secret: creating a signing key kept in the Actions cache"
            openssl rand -base64 24 | tr -d '\n' > keystore/pass
            keytool -genkeypair -keystore keystore/freitas.jks -storetype PKCS12 -alias freitas \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$(cat keystore/pass)" -keypass "$(cat keystore/pass)" \
              -dname "CN=Freitas Plus, O=Freitas, C=BR"
          fi

      - name: Brand as Freitas+
        run: python3 repo/android/brand.py app repo

      - name: Build
        working-directory: app
        run: |
          PASS="$(cat ../keystore/pass)"
          ./gradlew --no-daemon assembleLibreRelease \
            -Pjellyfin.version="${JELLYFIN_ANDROID_VER#v}" \
            -Pkeystore.file="$GITHUB_WORKSPACE/keystore/freitas.jks" \
            -Pkeystore.password="$PASS" \
            -Psigning.key.alias=freitas \
            -Psigning.key.password="$PASS"
          APK=$(ls app/build/outputs/apk/libre/release/*.apk | head -1)
          [ -n "$APK" ] || { echo "::error::APK not produced"; exit 1; }
          cp "$APK" "$GITHUB_WORKSPACE/Freitas-FireTV.apk"
          ls -la "$GITHUB_WORKSPACE/Freitas-FireTV.apk"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: firetv
          path: Freitas-FireTV.apk

  release:
    name: Publicar release
    runs-on: ubuntu-latest
    needs: [ web, tizen, firetv ]
    if: always() && needs.web.result == 'success'
    steps:
      - name: Download builds
        uses: actions/download-artifact@v4

      - name: Checkout (bridge)
        uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: bridge

      - name: Publish release "freitas-latest"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          FILES="web/freitas-web.tar.gz"
          [ -f tizen/Freitas-Samsung.wgt ] && FILES="$FILES tizen/Freitas-Samsung.wgt"
          [ -f firetv/Freitas-FireTV.apk ] && FILES="$FILES firetv/Freitas-FireTV.apk"
          cp src/bridge/freitas-bridge.mjs src/bridge/docker-compose.yml .
          FILES="$FILES freitas-bridge.mjs docker-compose.yml"
          gh release delete freitas-latest --yes --cleanup-tag || true
          gh release create freitas-latest $FILES \
            --target "${{ github.sha }}" \
            --title "Freitas+ (último build)" \
            --notes "Build automático do commit ${{ github.sha }}.

          - freitas-web.tar.gz: interface do servidor (rode freitas-update.sh no servidor).
          - Freitas-Samsung.wgt: app para TV Samsung (instale com o Apps2Samsung no PC).
          - Freitas-FireTV.apk: app para Fire TV / Android TV (instale pelo Downloader).
          - freitas-bridge.mjs + docker-compose.yml: ponte do catálogo e dos downloads (aba Descobrir)." \
            --prerelease
